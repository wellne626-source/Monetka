<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>NickForge — мощный генератор ников</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 10% 20%, #0a0c1a, #03050b);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* главный контейнер — плотный, с увеличенными краями */
        .main-card {
            max-width: 560px;
            width: 100%;
            margin: 0 auto;
            background: rgba(12, 16, 32, 0.75);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            border: 1px solid rgba(120, 130, 220, 0.4);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* меню — плотное, но отзывчивое */
        .menu-top {
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 8, 20, 0.6);
            border-bottom: 1px solid rgba(110, 125, 255, 0.3);
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 32px;
            background: linear-gradient(145deg, #b77cff, #6d8eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo-text {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFFFFF, #b9c6ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-icons {
            display: flex;
            gap: 20px;
        }

        .nav-icons a {
            color: #b9c4ff;
            font-size: 22px;
            transition: 0.2s;
            text-decoration: none;
        }

        .nav-icons a:hover {
            color: #a57cff;
            transform: scale(1.05);
        }

        /* герой */
        .hero-block {
            text-align: center;
            padding: 32px 20px 20px 20px;
        }

        .hero-block h1 {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.25;
            background: linear-gradient(125deg, #F0F3FF, #B7C0FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero-block p {
            font-size: 18px;
            opacity: 0.85;
            margin-top: 12px;
            font-weight: 500;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* карточка генератора — толстые отступы */
        .generator-box {
            margin: 20px 20px 30px 20px;
            background: rgba(8, 12, 26, 0.7);
            border-radius: 40px;
            padding: 28px 20px;
            border: 1px solid rgba(100, 120, 240, 0.3);
        }

        /* дисплей ника — крупный, жирный */
        .nick-screen {
            background: #050814;
            border-radius: 36px;
            padding: 28px 18px;
            text-align: center;
            margin-bottom: 28px;
            border: 1px solid #2f3570;
            box-shadow: 0 12px 20px -8px black;
        }

        .nickname {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -0.5px;
            word-break: break-word;
            background: linear-gradient(130deg, #f5f9ff, #bfccff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.3;
        }

        /* КНОПКИ крупные и толстые, удобные для пальцев */
        .button-row {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 22px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 100px;
            font-size: 18px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.2s;
            background: #1e2448;
            color: #eef3ff;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.3);
        }

        .btn-primary {
            background: linear-gradient(115deg, #4f46e5, #9f4aff);
            color: white;
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.4);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: #1e254e;
            border: 1px solid #5f6bc0;
        }

        .btn-secondary:active {
            transform: scale(0.97);
        }

        /* панель управления с фильтрами — крупные элементы */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-top: 16px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-label {
            font-weight: 700;
            font-size: 17px;
            letter-spacing: 0.5px;
            color: #bec8ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select, .range-input {
            background: #080c1c;
            border: 1px solid #3f4780;
            border-radius: 60px;
            padding: 16px 20px;
            color: white;
            font-size: 17px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            outline: none;
            width: 100%;
            cursor: pointer;
        }

        .range-wrapper {
            display: flex;
            align-items: center;
            gap: 18px;
            background: #080c1c;
            padding: 6px 18px;
            border-radius: 60px;
            border: 1px solid #3f4780;
        }

        .range-wrapper span {
            font-size: 20px;
            font-weight: 700;
            min-width: 48px;
            text-align: center;
            color: #ccdbff;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            background: #2e3466;
            border-radius: 10px;
        }

        input[type="range"]:focus {
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 26px;
            height: 26px;
            background: #8b5cf6;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px #a855f7;
            border: 2px solid white;
        }

        .length-value {
            font-size: 18px;
            font-weight: 600;
            background: #0b0f22;
            padding: 8px 12px;
            border-radius: 40px;
            text-align: center;
        }

        /* гигантская кнопка генерации внизу */
        .giant-gen {
            margin-top: 28px;
            text-align: center;
        }

        .glow-giant {
            background: linear-gradient(105deg, #6b47e0, #be5eff);
            border: none;
            width: 100%;
            padding: 20px 10px;
            border-radius: 80px;
            font-size: 24px;
            font-weight: 800;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 12px 25px rgba(98, 0, 234, 0.5);
        }

        .glow-giant:active {
            transform: scale(0.98);
        }

        .footer-badges {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 20px 20px 28px 20px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(110, 130, 250, 0.2);
            margin-top: 10px;
        }

        .badge {
            background: rgba(80, 90, 180, 0.25);
            padding: 8px 18px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        /* Для совсем маленьких экранов — ещё крупнее кнопки */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            .nickname {
                font-size: 30px;
            }
            .btn {
                padding: 12px 22px;
                font-size: 16px;
            }
            .glow-giant {
                font-size: 20px;
                padding: 18px 12px;
            }
            .hero-block h1 {
                font-size: 26px;
            }
            .control-label {
                font-size: 16px;
            }
            select, .range-wrapper {
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

<div class="main-card">
    <!-- меню с иконками и кнопкой вдохновения -->
    <div class="menu-top">
        <div class="logo-area">
            <i class="fas fa-skull-crossbones logo-icon"></i>
            <span class="logo-text">NickForge</span>
        </div>
        <div class="nav-icons">
            <a href="#"><i class="fas fa-magic"></i></a>
            <a href="#"><i class="fas fa-chart-line"></i></a>
            <a href="#"><i class="fas fa-user-astronaut"></i></a>
            <a href="#" id="inspireNavBtn"><i class="fas fa-lightbulb"></i></a>
        </div>
    </div>

    <div class="hero-block">
        <h1>✨ Хотите придумать ник?<br> Вам поможет наш сайт ✨</h1>
        <p><i class="fas fa-crown"></i> Ультра-стиль, киберпанк, милота — создай уникальный ник за секунду</p>
    </div>

    <div class="generator-box">
        <!-- дисплей с ником -->
        <div class="nick-screen">
            <div class="nickname" id="nickOutput">NeonPhantomX</div>
            <div class="button-row">
                <button class="btn btn-secondary" id="copyNickBtn"><i class="fas fa-copy"></i> Копировать</button>
                <button class="btn btn-secondary" id="randomizeBtn"><i class="fas fa-dice-d6"></i> Рандом</button>
            </div>
        </div>

        <!-- настройки: стиль, длина, цифры -->
        <div class="controls">
            <div class="control-item">
                <div class="control-label"><i class="fas fa-tag"></i> Твой стиль</div>
                <select id="styleSelect">
                    <option value="cyber">🔥 Киберпанк</option>
                    <option value="fantasy">🧙 Фэнтези / Эпик</option>
                    <option value="edgy">🖤 Эмо / Дарк</option>
                    <option value="cute">🍰 Милота / Кавай</option>
                    <option value="pro">🎮 Про-геймер</option>
                    <option value="random" selected>🌀 Рандом (всё подряд)</option>
                </select>
            </div>

            <div class="control-item">
                <div class="control-label"><i class="fas fa-ruler-combined"></i> Длина ника</div>
                <div class="range-wrapper">
                    <span>4</span>
                    <input type="range" id="lengthSlider" min="4" max="20" value="10">
                    <span>20</span>
                </div>
                <div class="length-value" id="lengthDisplay">10 символов</div>
            </div>

            <div class="control-item">
                <div class="control-label"><i class="fas fa-hashtag"></i> Цифры / спец</div>
                <select id="numberSelect">
                    <option value="none">🚫 Без цифр</option>
                    <option value="end" selected>🔢 Добавить число в конец</option>
                    <option value="random">🎲 Цифра внутри ника</option>
                </select>
            </div>
        </div>

        <!-- главная жирная кнопка -->
        <div class="giant-gen">
            <button class="glow-giant" id="generateBtn"><i class="fas fa-wand-magic"></i> Создать ник!</button>
        </div>
    </div>

    <div class="footer-badges">
        <span class="badge"><i class="fas fa-infinity"></i> 10K+ комбинаций</span>
        <span class="badge"><i class="fas fa-mobile-alt"></i> Толстые кнопки</span>
        <span class="badge"><i class="fas fa-bolt"></i> Мгновенно</span>
    </div>
</div>

<script>
    (function() {
        // Словари с большим количеством вариаций
        const PREFIX = {
            cyber: ["Neon", "Cyber", "Void", "Razor", "Glitch", "Pixel", "Fusion", "Zero", "Nova", "Flux", "Synth", "Xeno", "Kode", "Tech", "Rogue", "Phantom", "Cipher", "Radix"],
            fantasy: ["Elder", "Frost", "Shadow", "Moon", "Star", "Dragon", "Rune", "Iron", "Silver", "Wild", "Mystic", "Sage", "Ember", "Storm", "Fang", "Thorn", "Aegis", "Warden"],
            edgy: ["Cursed", "Grave", "Blood", "Raven", "Noctis", "Venom", "Dark", "Wraith", "Hollow", "Phantom", "Sorrow", "Ashes", "Reaper", "Grim", "Vile", "Marrow", "Dread"],
            cute: ["Sweet", "Bunny", "Lily", "Candy", "Peach", "Jelly", "Puffy", "Honey", "Twinkle", "Snuggles", "Daisy", "Mochi", "Bubbles", "Neko", "Kiki", "Mimi", "Lulu"],
            pro: ["Ace", "Godlike", "Blitz", "Instinct", "Legend", "Savage", "Zeus", "Rapid", "Quantum", "Toxic", "Vortex", "Prime", "Striker", "Elite", "ProX", "King", "Beast"]
        };
        const SUFFIX = {
            cyber: ["Byte", "Core", "Ware", "Net", "X", "Crypt", "Link", "Bot", "Frame", "Glitch", "Matrix", "Drive", "Node", "Hack", "Wave", "Flux"],
            fantasy: ["Blade", "Claw", "Wind", "Walker", "Heart", "Soul", "Warden", "Shield", "Spell", "Mancer", "Bane", "Keeper", "Fury", "Wing", "Howl"],
            edgy: ["Shade", "Night", "Bane", "Fang", "Grim", "Mortis", "Sin", "Doom", "Whisper", "Vile", "Hate", "End", "Kill", "Reap", "Thorn"],
            cute: ["Pop", "Bun", "Cake", "Puff", "Starlet", "Glitter", "Kiss", "Wink", "Berry", "Cookie", "Sunny", "Dolly", "Mochi", "Pie", "Cupcake"],
            pro: ["Hunter", "Killer", "Shot", "Clutch", "Flash", "Strike", "Fury", "Rush", "Blitz", "X", "Pro", "King", "Ace", "Pwn", "God"]
        };
        const extraMid = ["Storm", "Fire", "Dark", "Light", "Thunder", "Crystal", "Shadow", "Dusk", "Dawn", "Wolf", "Hawk", "Frost", "Flame"];

        function getRandomElement(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateNick(styleRaw, targetLength, numberMode) {
            let actualStyle = styleRaw;
            if (styleRaw === "random") {
                const stylesList = ["cyber", "fantasy", "edgy", "cute", "pro"];
                actualStyle = getRandomElement(stylesList);
            }
            let prefixList = PREFIX[actualStyle] || PREFIX.cyber;
            let suffixList = SUFFIX[actualStyle] || SUFFIX.cyber;

            let prefix = getRandomElement(prefixList);
            let suffix = getRandomElement(suffixList);
            let nick = prefix + suffix;

            // Добавляем "толстое" слово для увеличения длины, если нужно
            if (targetLength > 12 && nick.length < targetLength - 4) {
                let midWord = getRandomElement(extraMid);
                nick = prefix + midWord + suffix;
            }

            // Приведение длины
            if (nick.length > targetLength) {
                nick = nick.substring(0, targetLength);
            } else if (nick.length < targetLength) {
                let needed = targetLength - nick.length;
                let addon = "";
                if (numberMode !== "none" && needed > 0) {
                    for (let i = 0; i < needed && i < 4; i++) {
                        addon += Math.floor(Math.random() * 10);
                    }
                } else {
                    const letters = "xyzqwerty";
                    for (let i = 0; i < needed && i < 3; i++) {
                        addon += letters[Math.floor(Math.random() * letters.length)];
                    }
                }
                nick += addon;
            }

            // Применяем режим чисел ПОСЛЕ приведения длины
            if (numberMode === "end") {
                let num = Math.floor(Math.random() * 90) + 10; // 10-99
                if (nick.length + 2 <= targetLength + 1) {
                    nick += num;
                } else {
                    nick += Math.floor(Math.random() * 10);
                }
            } else if (numberMode === "random") {
                if (nick.length > 2) {
                    let pos = Math.floor(Math.random() * (nick.length - 1)) + 1;
                    let digit = Math.floor(Math.random() * 10);
                    nick = nick.slice(0, pos) + digit + nick.slice(pos);
                }
            }

            // Окончательная обрезка по targetLength после добавок
            if (nick.length > targetLength) {
                nick = nick.substring(0, targetLength);
            }

            // Капитализация первой буквы (если первый символ не цифра)
            if (nick.length > 0 && isNaN(parseInt(nick[0]))) {
                nick = nick[0].toUpperCase() + nick.slice(1);
            }

            if (nick.length === 0) nick = "PlayerOne";
            return nick;
        }

        // Получить значения из UI
        function getCurrentOptions() {
            const style = document.getElementById("styleSelect").value;
            const length = parseInt(document.getElementById("lengthSlider").value, 10);
            const numberMode = document.getElementById("numberSelect").value;
            return { style, length, numberMode };
        }

        function updateNicknameUI() {
            const { style, length, numberMode } = getCurrentOptions();
            const newNick = generateNick(style, length, numberMode);
            document.getElementById("nickOutput").innerText = newNick;
            return newNick;
        }

        // Копирование
        async function copyNick() {
            const nick = document.getElementById("nickOutput").innerText;
            if (!nick) return;
            try {
                await navigator.clipboard.writeText(nick);
                const copyBtn = document.getElementById("copyNickBtn");
                const originalHTML = copyBtn.innerHTML;
                copyBtn.innerHTML = '<i class="fas fa-check-circle"></i> Готово!';
                setTimeout(() => {
                    copyBtn.innerHTML = originalHTML;
                }, 1500);
            } catch(e) {
                alert("Нажми и удерживай, чтобы скопировать: " + nick);
            }
        }

        // Вдохновение: случайные настройки + свежий ник
        function inspireRandom() {
            const randStyleList = ["cyber", "fantasy", "edgy", "cute", "pro", "random"];
            const randStyle = randStyleList[Math.floor(Math.random() * randStyleList.length)];
            const randLen = Math.floor(Math.random() * 13) + 6; // от 6 до 18
            const numModes = ["none",
